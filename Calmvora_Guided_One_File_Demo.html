:root{color-scheme:light;--forest:#005D4F;--emerald:#0B7A68;--leaf:#89B95D;--sage:#B9D59A;--mint:#EAF3E2;--ivory:#F9FAF8;--ink:#1F2E2A;--ink2:#485D54;--muted:#78877F;--line:#E5EAE4;--white:#FFF;--cream:#F3F6EE;--rose:#A94949;--radius:18px;--shadow:0 12px 40px rgba(15,51,42,.055);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--ivory);min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}input,select,textarea{outline:none}input:focus,select:focus,textarea:focus{border-color:var(--emerald)!important;box-shadow:0 0 0 3px rgba(11,122,104,.11)}a{color:inherit;text-decoration:none}h1,h2,h3,h4,p{margin:0}svg{vertical-align:middle}.ico{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}.icon-small{width:16px;height:16px}.icon-lg{width:24px;height:24px}.visually-hidden{position:absolute!important;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
.boot-screen{height:100vh;min-height:400px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}.boot-screen h1{font-size:31px;letter-spacing:-1.2px}.boot-screen p{color:var(--muted)}.brand-emblem,.logo-mark{background:var(--forest);border-radius:14px;color:white;display:grid;place-items:center;width:43px;height:43px;font-size:29px;font-weight:600}.loader{border:2px solid var(--line);border-top-color:var(--emerald);height:27px;width:27px;border-radius:50%;animation:spin 850ms linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Calmvora v5 — form hierarchy, mobile readability and dashboard alignment */
:root{--cm-type-body:'DM Sans',system-ui,-apple-system,sans-serif;--cm-type-heading:'DM Serif Display',Georgia,serif}
.v3-dashboard-grid{grid-template-columns:minmax(310px,.96fr) minmax(0,1.84fr);gap:18px;align-items:start}
.v3-dashboard-right{gap:16px}.v3-overview-pair,.v3-charts,.v3-bottom-pair{gap:16px;align-items:stretch}.v3-overview-pair>.card,.v3-charts>.card,.v3-bottom-pair>.card{height:100%}
.v3-summary-card{min-height:180px}.v3-chart-card{min-height:290px}.v3-chart-card .chart-svg{height:auto;max-height:202px}.v3-bottom-pair{grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr)}.v3-plan{min-width:0}.v3-hero-stats>div{min-width:0}
.cm-form-modal{width:min(900px,100%);max-height:min(94dvh,920px);display:flex;flex-direction:column;overflow:hidden}.cm-form-modal .modal-header{flex:0 0 auto;background:#FFFEFA;z-index:2}.cm-form-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:20px}.cm-form-heading h2{font:400 clamp(26px,3vw,37px)/1.13 var(--cm-type-heading);letter-spacing:-.5px}
.cm-form-assurance{display:flex;align-items:flex-start;gap:13px;background:linear-gradient(108deg,#EEF5E9,#FDF4EF);border:1px solid #E4E9DD;padding:15px 16px;border-radius:17px;margin-bottom:18px}.cm-form-assurance-icon{min-width:36px;width:36px;height:36px;display:grid;place-items:center;background:#FFFDFB;color:#34735D;border:1px solid #DFE9DF;border-radius:12px}.cm-form-assurance strong{font-size:13px;color:#22493C}.cm-form-assurance p{font-size:12px;line-height:1.65;color:#62786C;margin-top:4px}
.cm-form-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F2F4EE;border:1px solid #E4EBE1;border-radius:14px;padding:5px;margin-bottom:20px}.cm-form-mode-btn{border:0;border-radius:10px;background:transparent;padding:12px 11px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 13px var(--cm-type-body);color:#667C6F;cursor:pointer;min-height:45px}.cm-form-mode-btn.is-active{background:#FFFDF9;box-shadow:0 3px 12px #34544417;color:#225D49;border:1px solid #E4EBE0}.cm-form-mode-btn .ico{width:17px;height:17px}
.cm-form-section{padding:18px;border:1px solid #E9ECE4;background:#FFFDFB;border-radius:18px;margin-bottom:16px}.cm-form-section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.cm-form-step{height:38px;width:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;background:#EAF3E5;color:#286A51;font-size:13px;font-weight:800}.cm-form-section-header h3{font:400 22px var(--cm-type-heading);color:#24382F}.cm-form-section-header p{font-size:11px;line-height:1.6;color:#7A897C;margin-top:4px}.cm-form-advanced:not(.is-open){display:none}.cm-form-modal .field-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cm-form-modal .field-label{font-size:12px;font-weight:750;color:#375746;margin-bottom:8px}.cm-form-modal .field-control{font:500 14px var(--cm-type-body);min-height:49px;border-radius:13px;padding:12px 14px}.cm-form-modal .field-control:focus{border-color:#85B19A;outline:3px solid #CFE6D480}.cm-form-modal textarea.field-control{line-height:1.65;min-height:122px}.cm-form-modal .field-hint{font-size:11px;line-height:1.6;color:#778778}.cm-form-modal .field.span-2{grid-column:span 2}.cm-preset-wrap{margin-top:9px}.cm-preset-label{font-size:10px;text-transform:uppercase;letter-spacing:.75px;font-weight:800;color:#77907B;margin-bottom:8px}.cm-preset-list{display:flex;flex-wrap:wrap;gap:7px}.cm-preset-chip{border:1px solid #DFE8DD;border-radius:999px;background:#F2F8F0;color:#305F4C;font-size:11px;line-height:1.3;padding:7px 10px;cursor:pointer}.cm-preset-chip:hover,.cm-preset-chip:focus-visible{background:#E5F3E4;border-color:#99C6AC}.cm-preset-chip.is-selected{background:#CDE8D2;border-color:#6EA989}.cm-help{padding-top:3px}.cm-form-save{position:sticky;bottom:-1px;background:linear-gradient(180deg,#FFFDFBFA,#FFFDFB 40%);padding:16px 3px 5px;margin-top:12px;z-index:4;align-items:center}.cm-form-save-note{font-size:11px;color:#6A8675;margin-right:auto;display:inline-flex;gap:7px;align-items:center}.cm-form-save-note .ico{width:16px;height:16px}
.entry-card .entry-summary{gap:9px}.entry-card .entry-chip{background:#F8FAF5}.entry-card .entry-actions .btn{min-height:37px;font-size:12px}.entry-card .entry-actions .btn-soft{background:#E7F3E8}.entry-card .entry-actions .btn-danger{margin-left:auto}
@media(max-width:1280px){.v3-dashboard-grid{grid-template-columns:1fr}.v3-plan{max-width:none}.v3-charts{grid-template-columns:repeat(2,minmax(0,1fr))}.v3-hero-stats{width:min(47%,520px)}}
@media(max-width:900px){.cm-form-modal{width:min(96vw,100%)}.cm-form-modal .field-grid{grid-template-columns:1fr}.cm-form-modal .field.span-2{grid-column:auto}.v3-charts{grid-template-columns:1fr}.v3-bottom-pair{grid-template-columns:1fr}}
@media(max-width:620px){.cm-form-modal{height:100dvh;max-height:100dvh;width:100%;border-radius:0}.modal-backdrop{padding:0;align-items:stretch}.cm-form-modal .modal-header{padding:19px 18px 15px}.cm-form-body{padding:15px 14px 22px}.cm-form-section{padding:15px 13px}.cm-form-section-header h3{font-size:21px}.cm-form-save{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:15px 0 calc(9px + env(safe-area-inset-bottom));margin-top:10px}.cm-form-save-note{grid-column:1/-1}.cm-form-save .btn{width:100%;font-size:13px;padding:12px 7px}.cm-form-modal .field-grid{gap:17px}.cm-form-modal .field-label{font-size:13px}.cm-form-modal .field-control{font-size:16px;min-height:51px}.cm-preset-chip{font-size:12px;min-height:34px}.cm-form-assurance p{font-size:11px}.v3-dashboard-grid{display:flex;flex-direction:column;gap:13px}.v3-dashboard-left,.v3-dashboard-right{width:100%}.v3-overview-pair,.v3-charts,.v3-bottom-pair{grid-template-columns:1fr}.v3-hero-stats{width:100%}.v3-summary-card{min-height:155px}}
@media print{.modal-backdrop,.cm-form-modal,.cm-form-mode{display:none!important}}

/* Guided demo: compact onboarding, context help and interactive feature coach */
.cm-context-help{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 16px;margin:0 0 20px;border:1px solid #E3EBDE;border-radius:16px;background:#F5F9F1;box-shadow:0 4px 14px #26523c08}
.cm-context-help-copy{display:flex;gap:11px;align-items:center;min-width:0}.cm-context-help-copy>div{display:flex;flex-direction:column;gap:4px;min-width:0}.cm-context-help strong{font-size:13px;color:#264C3E}.cm-context-help span{font-size:11px;color:#6E8176;line-height:1.45}.cm-help-spark{width:34px;height:34px;min-width:34px;background:#E0EEE0;color:#27684F;border-radius:11px;display:grid;place-items:center}.cm-context-help .btn{flex:0 0 auto}
.cm-guide-intro{position:relative;overflow:hidden;border:1px solid #E7E9DC;border-radius:23px;background:linear-gradient(115deg,#F4F8EF 10%,#FFF8F5 65%,#ECF4E8);padding:30px 34px;margin-bottom:19px}.cm-guide-intro::after{content:'✿';position:absolute;right:40px;top:8px;font-size:140px;color:#91B798;opacity:.14;pointer-events:none;font-family:Georgia,serif}.cm-guide-intro h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:34px;margin:9px 0 8px;color:#244A3B}.cm-guide-intro p{max-width:640px;font-size:13px;line-height:1.75;color:#607568}.cm-guide-badge{display:inline-flex;gap:7px;align-items:center;font-size:10px;font-weight:800;letter-spacing:1.2px;color:#327456}.cm-guide-intro-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;position:relative;z-index:1}
.cm-guide-layout{display:grid;grid-template-columns:minmax(230px,285px) minmax(0,1fr);gap:16px;align-items:start}.cm-guide-index{background:#F9FAF5;border:1px solid #E7ECE4;border-radius:19px;padding:18px;max-height:min(75vh,850px);overflow:auto}.cm-guide-group+ .cm-guide-group{margin-top:20px}.cm-guide-group h3{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.35px;color:#768D7D;margin:0 0 10px;text-transform:uppercase}.cm-guide-topic{width:100%;display:flex;align-items:center;gap:9px;border:1px solid transparent;border-radius:11px;background:transparent;color:#456453;font-size:12px;min-height:41px;padding:9px 10px;text-align:left;cursor:pointer}.cm-guide-topic span{flex:1}.cm-guide-topic .ico{height:16px;width:16px}.cm-guide-topic.is-active{background:#23634F;color:white;box-shadow:0 4px 14px #225A451C}.cm-guide-topic:hover:not(.is-active){background:#EDF3E9}
.cm-guide-detail{padding:23px 28px 25px}.cm-guide-detail-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid #EBEEE6}.cm-guide-large-icon{width:56px;height:56px;min-width:56px;display:grid;place-items:center;border-radius:18px;background:#ECF4E6;color:#2B735D}.cm-guide-large-icon .ico{width:28px;height:28px}.cm-guide-detail-top h2{font-size:30px;margin:4px 0 8px}.cm-guide-detail-top p{color:#627A6A;font-size:13px;line-height:1.65}.cm-guide-steps{display:grid;gap:12px}.cm-guide-step{display:flex;align-items:flex-start;gap:13px;background:#FFFEFC;border:1px solid #E9ECE6;border-radius:15px;padding:14px}.cm-guide-step-no{height:30px;min-width:30px;display:grid;place-items:center;border-radius:9px;color:#2D735B;background:#E9F2E4;font-size:11px;font-weight:800}.cm-guide-step h3{font-family:'DM Sans',sans-serif;font-size:13px;color:#2B4638;font-weight:800;margin:0 0 5px}.cm-guide-step p{font-size:12px;line-height:1.7;color:#657A6D;margin:0}.cm-guide-bottom{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.cm-guide-disclaimer{padding:16px 8px;font-size:12px;line-height:1.7;color:#7C867E}
.cm-guide-coach{position:fixed;right:22px;bottom:23px;z-index:160;width:min(388px,calc(100vw - 30px));max-height:min(58vh,520px);overflow:auto;scrollbar-width:thin;background:#FFFDF9;border:1px solid #CDE1D2;border-radius:20px;padding:19px 20px 15px;box-shadow:0 21px 68px #193D2D33,0 0 0 1px #FFF8;animation:cm-coach-in .18s ease-out}.cm-coach-header{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}.cm-coach-header h3{font-family:'DM Serif Display',Georgia,serif;font-size:23px;line-height:1.18;margin:6px 0 10px;color:#244838}.cm-coach-overline{font-size:10px;letter-spacing:1.1px;color:#36785D;font-weight:800}.cm-guide-coach p{font-size:13px;line-height:1.65;color:#526A5C;margin:0 0 15px}.cm-coach-close{width:31px;height:31px;min-width:31px;border:1px solid #E4EAE0;border-radius:9px;background:#FFFDF9;color:#245440;display:grid;place-items:center;cursor:pointer}.cm-coach-close .ico{width:17px;height:17px}.cm-coach-progress{height:6px;width:100%;background:#E9F1E7;border-radius:99px;overflow:hidden;margin:0 0 14px}.cm-coach-progress span{height:100%;background:#4B9270;display:block;border-radius:99px;transition:width .2s}.cm-coach-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.cm-coach-actions .btn{font-size:11px;padding:8px 10px}.cm-coach-all{border:0;background:none;color:#427A62;font-size:11px;font-weight:700;padding:12px 0 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.cm-guide-focus{outline:3px solid #8BBF8A!important;outline-offset:5px;border-radius:14px;box-shadow:0 0 0 9px #8fbd7a22!important;transition:outline-color .2s}.cm-guide-topic:focus-visible,.cm-coach-close:focus-visible,.cm-coach-all:focus-visible{outline:3px solid #7FB394;outline-offset:2px}

const shift=(days)=>{const n=new Date();n.setDate(n.getDate()+days);return fmt(n);};
let seq=0;const records=[];
let prefs={displayName:'Sophie',journeyStart:shift(-23),temperatureUnit:'°C'};
function add(type,values){const date=String(values[schemas[type].dateKey]||shift(0));const title=type==='DAILY'?`Daily check-in · ${date}`:type==='MEAL'?`${values.meal_slot} · ${values.meal_name}`:String(values[schemas[type].summaryKey]||schemas[type].label);const now=new Date().toISOString();const row={id:'demo-'+(++seq),type,date,title,values,status:'ACTIVE',createdAt:now,updatedAt:now,revision:1};records.push(row);return {...row};}
function seed(){
 records.length=0;seq=0;prefs={displayName:'Sophie',journeyStart:shift(-23),temperatureUnit:'°C'};
 for(let i=0;i<14;i++)if(i%4!==2){const d=shift(-13+i);add('DAILY',{date:d,bleeding:i===7?'Spotting':'None',discomfort:Math.max(1,Math.min(9,Math.round(4+3*Math.sin(i*1.1)))),energy:Math.max(1,Math.min(9,Math.round(6+2*Math.cos(i*.8)))),mood:['Good','Neutral','Calm','Low'][i%4],sleep_hours:6+(i%3),symptoms:i%3?'Mild tiredness':'',notes:'Fictional sample observation only.'});}
 for(let i=0;i<4;i++)add('CYCLE',{start_date:shift(-82+i*27),end_date:shift(-78+i*27),flow:'Moderate',notes:'Fictional cycle sample'});
 for(let i=0;i<6;i++)add('SYMPTOM',{date:shift(-i*2),name:['Bloating','Cramping','Fatigue'][i%3],intensity:i%5+2,context:'Sample only'});
 for(let i=0;i<8;i++)add('MEAL',{date:shift(i-1),meal_slot:['Breakfast','Lunch','Dinner','Snack'][i%4],meal_name:['Overnight oats with berries','Grilled chicken salad','Salmon with lemon & greens','Greek yogurt parfait'][i%4],ingredients:'Simple groceries',favourite:'Yes',notes:'Only a sample meal; not a specific PCOS diet.'});
 for(let i=0;i<6;i++)add('ROUTINE',{date:shift(-i),activity:['Comfortable walk','Quiet reflection','Gentle stretching'][i%3],category:'Movement',minutes:20,status:i%3?'Completed':'Planned',notes:'Optional and illustrative.'});
 for(let i=0;i<5;i++)add('BBT',{date:shift(-i),temperature:36.4+i*.1,unit:'°C',opk:'Not recorded',notes:'Fictional sample reading.'});
 add('DOCTOR',{visit_date:shift(10),provider:'Sample follow-up consultation',status:'Planned',questions:'What follow-up is appropriate for me? What do I need to ask about these symptoms?',notes:''});
 add('GOAL',{start_date:shift(-10),title:'Make room for more rest',review_date:shift(15),status:'Active',reason:'Fictional personal goal.'});
 add('REVIEW',{week_date:shift(-7),wins:'Consistent journaling',challenges:'Busy days',next_steps:'Smaller optional goals',doctor_questions:''});
 for(let i=0;i<5;i++)add('CARE',{date:shift(-i),task_key:['journal','nourishment','movement','rest','questions'][i],task_title:['Notice how today feels','Plan something nourishing','Make room for comfortable movement','Leave room for rest and kindness','Keep one question for your clinician'][i],status:'Done',notes:'Fictional example.'});
 const med=add('MED',{start_date:shift(-28),end_date:shift(60),medicine_name:'Sample medicine (fictional)',strength:'Use your actual prescription in the paid app',schedule:'Twice daily',scheduled_times:'08:00,20:00',instructions:'Fictional example. No medical instruction or dose provided.',prescribed_by:'Example clinician',notes:'Never use demo records as a treatment recommendation.'});
 for(let i=1;i<=3;i++)add('DOSE',{date:shift(-i),medicine_id:med.id,medicine_name:med.values.medicine_name,scheduled_time:'08:00',status:'Taken',actual_time:'08:03',notes:'Fictional check-in.'});
}
seed();

return {getBootstrap:snapshot,activateLicense:()=>snapshot(),savePreferences:p=>(prefs={...p}),resetDemo:()=>{seed();return snapshot();},
 saveRecord:input=>{if(!schemas[input.type])throw Error('Invalid type');if(!input.values||!input.values[schemas[input.type].dateKey])throw Error('Date is required');
 if(input.id){const row=records.find(x=>x.id===input.id);if(!row||row.revision!==input.expectedRevision)throw Error('Record changed elsewhere');row.values={...input.values};row.date=String(input.values[schemas[input.type].dateKey]);row.title=String(input.values[schemas[input.type].summaryKey]||schemas[input.type].label);row.revision++;row.updatedAt=new Date().toISOString();return {...row};}
 return add(input.type,input.values);},
 archiveRecord:(id,rev)=>update(id,rev,'ARCHIVED'),restoreRecord:(id,rev)=>update(id,rev,'ACTIVE'),
 deleteRecordPermanently:(id,rev,confirmation)=>{const i=records.findIndex(x=>x.id===id);if(confirmation!=='PERMANENT_DELETE'||i<0||records[i].revision!==rev||records[i].status!=='ARCHIVED')throw Error('Deletion not permitted.');records.splice(i,1);return {deleted:true,id};},
 exportBackup:()=>{throw Error('Export is available only in the purchased version. Do not enter real health information into this demo.');},
 importBackup:()=>{throw Error('Import is disabled in the public demo to protect personal information.');}
 };

})();

    }).formatToParts(now);

function svgTrend(points1,points2,labels={one:'Discomfort',two:'Energy'},yMin=0,yMax=10){const W=640,H=225,L=32,T=17,R=13,B=38,plotH=H-T-B,plotW=W-L-R;const days=points1.length;const fX=i=>L+(days<=1?plotW/2:i*plotW/(days-1));const fY=n=>T+(yMax-n)/(yMax-yMin)*plotH;
const lines=[0,.25,.5,.75,1].map(q=>`<line x1="${L}" x2="${W-R}" y1="${(T+q*plotH).toFixed(1)}" y2="${(T+q*plotH).toFixed(1)}" stroke="#E8EEE8" stroke-dasharray="3 5"/><text x="${L-7}" y="${(T+q*plotH+4).toFixed(1)}" text-anchor="end" fill="#91A097" font-size="9">${(yMax-(yMax-yMin)*q).toFixed(yMax===10?0:1)}</text>`).join('');
const path=arr=>{let str='',open=false;arr.forEach((v,i)=>{if(v===null||v===undefined||!Number.isFinite(Number(v))){open=false;return;}str+=(open?' L':' M')+fX(i).toFixed(1)+' '+fY(Number(v)).toFixed(1);open=true;});return str.trim();};
const circles=(arr,col)=>arr.map((v,i)=>v===null||v===undefined?'':`<circle cx="${fX(i)}" cy="${fY(Number(v))}" r="3.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`).join('');
return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Self-reported trend chart">${lines}<path d="${path(points1)}" stroke="#0B7A68" fill="none" stroke-width="2.6" stroke-linejoin="round"/>${circles(points1,'#0B7A68')}<path d="${path(points2)}" stroke="#89B95D" fill="none" stroke-width="2.6" stroke-linejoin="round"/>${circles(points2,'#89B95D')}${Array.from({length:days},(_,i)=>i%Math.max(1,Math.ceil(days/7))===0||i===days-1?`<text x="${fX(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#78877F">${esc(labels.dates?.[i]||'')}</text>`:'').join('')}</svg><div class="chart-legend"><span><i class="legend-dot" style="background:#0B7A68"></i>${esc(labels.one)}</span><span><i class="legend-dot" style="background:#89B95D"></i>${esc(labels.two)}</span></div>`;}
function calcComparison(){const days=state.period==='custom'?Math.max(1,Math.min(365,dateDiff(state.reportTo,state.reportFrom)+1)):Number(state.period);const end=state.period==='custom'?state.reportTo:today();const first=state.period==='custom'?state.reportFrom:dateAdd(end,-days+1);const prevEnd=dateAdd(first,-1),prevStart=dateAdd(prevEnd,-days+1);
const a=activeRecords().filter(r=>r.date>=first&&r.date<=end),b=activeRecords().filter(r=>r.date>=prevStart&&r.date<=prevEnd);return {days,first,end,prevStart,prevEnd,a,b};}
function analyticsScreen(){const c=calcComparison(),daily=activeRecords('DAILY');const points=Array.from({length:Math.min(14,c.days)},(_,i)=>dateAdd(c.end,i-Math.min(14,c.days)+1));const first=points.map(d=>{const r=daily.find(x=>x.date===d);return r&&r.values.discomfort!==''?Number(r.values.discomfort):null;});const second=points.map(d=>{const r=daily.find(x=>x.date===d);return r&&r.values.energy!==''?Number(r.values.energy):null;});
const tab=()=>`<div class="pill-tabs">${['30','60','90','custom'].map(v=>`<button class="pill-tab ${v===state.period?'active':''}" data-action="period" data-value="${v}">${v==='custom'?'Custom':v+' days'}</button>`).join('')}</div>`;
return `${titlebar('Personal insights','Compare logging activity and see self-reported patterns. These are not clinical improvement measures.') }<div class="toolbar" style="justify-content:space-between">${tab()}${state.period==='custom'?`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><input id="analytics-from" class="select-small" type="date" value="${esc(state.reportFrom)}"><span class="subtle">to</span><input id="analytics-to" class="select-small" type="date" value="${esc(state.reportTo)}"></div>`:`<span class="subtle">${fmtDate(c.first)} – ${fmtDate(c.end)}</span>`}</div><div class="grid-4" style="margin-bottom:19px">${stat('Current period entries',c.a.length,'book-open','Selected time window')}${stat('Previous period entries',c.b.length,'calendar-days','Equivalent preceding window')}${stat('Symptoms logged',c.a.filter(r=>r.type==='SYMPTOM').length,'activity','Self-reported observations')}${stat('Routine completions',c.a.filter(r=>r.type==='ROUTINE'&&r.values.status==='Completed').length,'target','Marked completed')}</div><div class="grid-2"><div class="card pad"><div class="card-head"><h3>Discomfort & energy observations</h3><span class="tag">0–10</span></div>${svgTrend(first,second,{one:'Discomfort',two:'Energy',dates:points.map(d=>d.slice(5))})}<p class="subtle" style="margin-top:10px">Only dates with a recorded value appear. Missing values are not assumed to be zero.</p></div><div class="card pad"><div class="card-head"><h3>Module activity comparison</h3><span class="subtle">Entries, not outcomes</span></div><div class="table-wrap"><table class="clean-table"><thead><tr><th>Module</th><th>Current</th><th>Previous</th></tr></thead><tbody>${['DAILY','CYCLE','SYMPTOM','BBT','MEAL','ROUTINE','REVIEW'].map(t=>`<tr><td>${esc(moduleName(t))}</td><td><b>${c.a.filter(r=>r.type===t).length}</b></td><td>${c.b.filter(r=>r.type===t).length}</td></tr>`).join('')}</tbody></table></div></div></div><div class="card pad" style="margin-top:19px"><div class="card-head"><h3>BBT history</h3><span class="subtle">Readings are converted to °C for display</span></div>${bbtChart()}</div><div class="panel-message" style="margin-top:17px">Intensity trends, BBT, cycle patterns and counts here are descriptive only. They do not confirm ovulation, diagnose conditions, establish causality or show a treatment effect.</div>`;

function bbtChart(){const arr=sortedRecords('BBT').filter(r=>r.values.temperature!=='').slice(0,14).reverse();if(!arr.length)return `<div class="empty"><h3>No temperature records yet</h3><p>Add BBT readings to see your own recorded history.</p><button class="btn btn-soft" data-action="add" data-type="BBT">Add reading</button></div>`;const val=arr.map(r=>r.values.unit==='°F'?(Number(r.values.temperature)-32)*5/9:Number(r.values.temperature));const min=Math.min(...val)-.4,max=Math.max(...val)+.4;return svgTrend(val,Array(val.length).fill(null),{one:'Temperature (°C)',two:'',dates:arr.map(r=>r.date.slice(5))},min,max);}

    control=`<div class="cm-slider-line"><input class="field-control cm-range-input" name="${esc(f.key)}" type="number" min="0" max="10" step="1" value="${esc(val)}" placeholder="Optional"><output id="out-${esc(f.key)}">${val===''?'Not tracked':esc(val)+' / 10'}</output></div><input class="cm-slider" data-slider-for="${esc(f.key)}" type="range" min="0" max="10" step="1" value="${val===''?5:esc(val)}" aria-label="${esc(f.label)} slider"><p class="field-hint">Optional · 0 = low / none, 10 = high · leave blank if not tracked</p>`;
  } else {
    control=`<input class="field-control" name="${esc(f.key)}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?`min="${f.min}" max="${f.max}" step="${f.step||'any'}"`:''} ${f.maxLength?`maxlength="${f.maxLength}"`:''} value="${esc(val)}" ${required}>`;
  }
  const suggestions=(f.type==='text'||f.type==='textarea')?cmFieldPresets(state.modal?.type,f.key):[];
  const help=cmUiHelp(state.modal?.type,f.key);
  const presets=suggestions.length?`<div class="cm-preset-wrap"><div class="cm-preset-label">Optional ideas · tap to fill, or type your own</div><div class="cm-preset-list">${suggestions.slice(0,7).map(x=>`<button type="button" class="cm-preset-chip" data-action="form-preset" data-name="${esc(f.key)}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:'';
  const rowclass='field '+(f.type==='textarea'?'span-2 ':'')+(f.detailed?'cm-field-detailed':'');
  return `<div class="${rowclass}"><label class="field-label">${esc(f.label)} ${f.required?'<span class="label-required">*</span>':''}</label>${control}${presets}${help?`<p class="field-hint cm-help">${esc(help)}</p>`:''}</div>`;
}

iv><div class="field-grid">${extra.map(f=>cmFieldHtml(f,m.record?.values||m.values||{})).join('')}</div></div>`:''}<div class="form-actions cm-form-save"><span class="cm-form-save-note">${icon('shield-check','icon-small')} Practice only · resets on refresh</span><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${icon('check')} ${m.record?'Save changes':'Save record'}</button></div></form></div></section></div>`;

function cmCareLog(date,key){return activeRecords('CARE').find(r=>r.date===date&&r.values.task_key===key);}
function cmCareCount(date){return CM_CARE_TASKS.filter(t=>cmCareLog(date,t.key)?.values?.status==='Done').length;}
function cmMedicineTimes(m){return String(m.values.scheduled_times||'').split(',').map(s=>s.trim()).filter(s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s));}
function cmMedicineActiveOn(m,date){return m.status==='ACTIVE' && date>=m.values.start_date && (!m.values.end_date||date<=m.values.end_date);}
function cmDoseLog(m,date,time){return activeRecords('DOSE').find(r=>r.date===date&&r.values.medicine_id===m.id&&(r.values.scheduled_time||'')===time);}
function cmNiceDay(date){return new Date(dayMs(date)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}
function welcomeCareCard(){const done=cmCareCount(today()),total=CM_CARE_TASKS.length,meds=activeRecords('MED').length;return `<div class="welcome-bar"><div class="welcome-orb" aria-hidden="true">✿</div><div><div class="eyebrow">A LITTLE CARE, ONE DAY AT A TIME</div><strong>Every day deserves its own page.</strong><p>Your optional care notes: ${done}/${total} for today. ${meds?`${meds} medicine ${meds===1?'schedule':'schedules'} saved.`:'Add a prescription only if you have one.'}</p></div><div class="welcome-actions"><button class="btn btn-primary" data-action="navigate" data-screen="care">Open today’s plan ${icon('arrow-right','icon-small')}</button><button class="btn btn-outline" data-action="navigate" data-screen="guide">How it works</button></div></div>`;}
function cmMiniWeek(){const picked=state.careDate;const start=dateAdd(picked,-((new Date(dayMs(picked)).getUTCDay()+6)%7));return `<div class="care-week-strip">${Array.from({length:7},(_,i)=>{const d=dateAdd(start,i),s=new Date(dayMs(d)).toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'});return `<button class="day-chip ${d===picked?'selected':''} ${d===today()?'is-today':''}" data-action="care-date" data-date="${d}" aria-label="Select ${cmNiceDay(d)}" aria-pressed="${d===picked}"><small>${s}</small><strong>${+d.slice(-2)}</strong><span class="dotline">${cmCareCount(d)>0?'●':'·'}</span></button>`;}).join('')}</div>`;}
function cmCalendar(){const month=state.careMonth+'-01',first=new Date(dayMs(month)),firstOffset=(first.getUTCDay()+6)%7,days=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate(),heading=first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});return `<div class="card pad cal-card"><div class="card-head"><div><div class="eyebrow">DATE-WISE PLANNING</div><h3>${heading}</h3></div><div class="calendar-controls"><button class="btn btn-icon" data-action="care-prev" aria-label="Previous month">‹</button><button class="btn btn-icon" data-action="care-next" aria-label="Next month">›</button></div></div><div class="month-grid">${['M','T','W','T','F','S','S'].map(x=>`<span class="month-head">${x}</span>`).join('')}${Array.from({length:firstOffset},()=>'<span class="month-blank"></span>').join('')}${Array.from({length:days},(_,i)=>{const d=state.careMonth+'-'+String(i+1).padStart(2,'0'),count=cmCareCount(d);return `<button class="month-day ${d===state.careDate?'selected':''} ${d===today()?'is-today':''}" data-action="care-date" data-date="${d}" aria-label="${cmNiceDay(d)} · ${count} care activities" aria-pressed="${d===state.careDate}">${i+1}${count?'<i aria-hidden="true"></i>':''}</button>`;}).join('')}</div><p class="soft-note">Select any past or future date. A small dot means at least one care activity was logged.</p></div>`;}
function cmDosesFor(date){const out=[];activeRecords('MED').filter(m=>cmMedicineActiveOn(m,date)).forEach(m=>cmMedicineTimes(m).forEach(t=>out.push({m,t,log:cmDoseLog(m,date,t)})));return out.sort((a,b)=>a.t.localeCompare(b.t));}

function cmGuideInfo(key){

  if(!schema)return {key,title,icon:ico,why:'Explore this feature in the temporary demo.',steps:[]};

function cmGuideFocus(){

 if(e.target.classList?.contains('cm-range-input')){const out=document.getElementById('out-'+e.target.name),slider=document.querySelector(`[data-slider-for="${e.target.name}"]`);if(out)out.textContent=e.target.value===''?'Not tracked':e.target.value+' / 10';if(slider&&e.target.value!=='')slider.value=e.target.value;}
 if(e.target.dataset.sliderFor){const inp=document.querySelector(`[name="${e.target.dataset.sliderFor}"]`);if(inp)inp.value=e.target.value;const n=document.getElementById('out-'+e.target.dataset.sliderFor);if(n)n.textContent=e.target.value+' / 10';return;}
if(e.target.id==='record-search'){state.search=e.target.value;const next=moduleScreen();const tmp=document.createElement('div');tmp.innerHTML=next;const current=document.getElementById('recordList');if(current)current.innerHTML=tmp.querySelector('#recordList').innerHTML;const count=document.querySelector('.v3-filter-count');if(count)count.textContent=tmp.querySelector('.v3-filter-count')?.textContent||'0 results';}
 if(e.target.name==='medicine_id'&&state.modal?.type==='DOSE'&&e.type==='change'){const m=activeRecords('MED').find(x=>x.id===e.target.value),out=document.querySelector('[name=medicine_name]');if(out)out.value=m?.values?.medicine_name||'';}
 if(e.target.id==='archive-toggle'&&e.type==='change'){state.showArchived=e.target.checked;render();}
 if((e.target.id==='analytics-from'||e.target.id==='analytics-to')&&e.type==='change'){const from=document.getElementById('analytics-from').value,to=document.getElementById('analytics-to').value;if(from&&to&&from<=to){state.reportFrom=from;state.reportTo=to;render();}}
 if(e.target.id==='import-file'&&e.type==='change'&&e.target.files?.[0]){const file=e.target.files[0];if(file.size>1200000){toast('Backup exceeds 1.2 MB limit.',true);return;}
 if(!confirm('Import entries as new copies? Existing entries will remain unchanged.')){e.target.value='';return;}
 file.text().then(body=>transact('Importing backup…',async()=>{const outcome=await server('importBackup',body);await refresh();toast(`${outcome.imported} entries imported.`);})).catch(err=>toast(err.message,true));}
}
// Refresh the clock when a visitor returns to the tab, travels, changes device timezone,
// or crosses local midnight. Preserve manually selected historical/future dates.
let cmLastAutoDate = today();
let cmLastZone = cmDeviceTimeZone();
function cmRefreshLocalClock(){
  const newDay = today(), zone = cmDeviceTimeZone();
  for(const id of ['cm-local-clock','cm-mobile-local-clock']){
    const clock=document.getElementById(id);
    if(clock){clock.textContent=cmClockLabel();clock.parentElement.title='Your device timezone: '+zone;}
  }
  if(newDay !== cmLastAutoDate || zone !== cmLastZone){
    if(state.careDate===cmLastAutoDate){state.careDate=newDay;state.careMonth=newDay.slice(0,7);}
    if(state.filterExact===cmLastAutoDate)state.filterExact=newDay;
    cmLastAutoDate=newDay;cmLastZone=zone;
    if(state.boot?.activated && !state.modal)render();
  }
}
async function init(){document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.modal){state.modal=null;render();}else if(e.key==='Escape'&&state.guideCoach){state.guideCoach=null;render();}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)cmRefreshLocalClock();});setInterval(cmRefreshLocalClock,30000);document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('input',onInput);document.addEventListener('change',onInput);
 try{state.boot=await server('getBootstrap');if(state.boot?.activated){state.reportTypes=reportGroups();}render();}catch(e){document.getElementById('app').innerHTML=`<div class="boot-screen" style="padding:30px;text-align:center"><div class="brand-emblem cm-official-brand-icon" role="img" aria-label="Calmvora emblem">✳</div><h1>Unable to open Calmvora</h1><p style="max-width:460px">${esc(e.message||'An unexpected error occurred.')}</p><button class="btn btn-primary" onclick="location.reload()">Try again</button></div>`;}
}
init();
})();
